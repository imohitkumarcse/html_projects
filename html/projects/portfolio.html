<!doctype html>

<head>
    
    <title>Portfolio</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033
        }

        nav {
            padding: 16px 5%;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px
        }

        .hero {
            padding: 55px 0
        }

        h1 {
            font-size: clamp(40px, 7vw, 76px)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px
        }

        .card {
            background: #fff;
            padding: 20px;
            border: 1px solid #e4e7ee;
            border-radius: 18px;
            box-shadow: 0 8px 25px #0000000b
        }

        .btn {
            background: #5757f7;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: bold;
            cursor: pointer
        }

        .alt {
            background: #eef0ff;
            color: #4b4bd2
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px
        }

        .row {
            display: flex;
            gap: 10px
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 99px;
            background: #eef0ff;
            color: #4b4bd2;
            font-size: 12px;
            font-weight: bold
        }

        .stat {
            font-size: 32px;
            font-weight: bold
        }

        @media(max-width:650px) {
            .row {
                flex-wrap: wrap
            }
        }
    </style>
</head>

<body>
    <nav><b> MOHIT.DEV</b><span>Work · About · Contact</span></nav>
    <main>
        <section class="hero"><span class="tag">FRONTEND DEVELOPER</span>
            <h1>Building digital experiences people remember.</h1>
            <p>Responsive portfolio with filtering and interactive contact.</p><button class="btn"
                onclick="document.getElementById('work').scrollIntoView({behavior:'smooth'})">View Work</button>
        </section>
        <section id="work">
            <h2>Projects</h2><select id="f" onchange="render()">
                <option>All</option>
                <option>Web</option>
                <option>AI</option>
                <option>UI</option>
            </select>
            <div id="p" class="grid"></div>
        </section>
        <section class="card" style="margin-top:20px">
            <h2>Contact</h2><input placeholder="Email"><button class="btn" style="margin-top:10px"
                onclick="alert('Demo message sent')">Send</button>
        </section>
    </main>
    <script>const d = [["AI Study Coach", "AI"], ["Nova Store", "Web"], ["Finance OS", "UI"], ["Ethics Gate", "AI"], ["Travelly", "Web"]]; function render() { p.innerHTML = d.filter(x => f.value == "All" || x[1] == f.value).map(x => `<article class="card"><span class="tag">${x[1]}</span><h2>${x[0]}</h2><button class="btn alt" onclick="alert('Project opened')">View</button></article>`).join("") } render();</script>
</body>

</html>

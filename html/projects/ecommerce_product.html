<!doctype html>

<head>
    <title>E-commerce Product</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033
        }

        nav {
            padding: 16px 5%;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px
        }

        .hero {
            padding: 55px 0
        }

        h1 {
            font-size: clamp(40px, 7vw, 76px)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px
        }

        .card {
            background: #fff;
            padding: 20px;
            border: 1px solid #e4e7ee;
            border-radius: 18px;
            box-shadow: 0 8px 25px #0000000b
        }

        .btn {
            background: #5757f7;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: bold;
            cursor: pointer
        }

        .alt {
            background: #eef0ff;
            color: #4b4bd2
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px
        }

        .row {
            display: flex;
            gap: 10px
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 99px;
            background: #eef0ff;
            color: #4b4bd2;
            font-size: 12px;
            font-weight: bold
        }

        .stat {
            font-size: 32px;
            font-weight: bold
        }

        @media(max-width:650px) {
            .row {
                flex-wrap: wrap
            }
        }
    </style>
</head>

<body>
    <nav>
        <b>NOVA STORE</b>
        <span>🛒 Cart <b id="c">0</b>
        </span>
    </nav>
    <main>
        <div class="grid" style="margin-top:50px">
            <div class="card" style="text-align:center;font-size:160px">
            </div>
            <div><span class="tag">BESTSELLER</span>
                <h1>Nova Air Headphones</h1>
                <p>Noise cancellation, immersive audio and 40-hour battery.</p>
                <div class="stat">₹7,999</div><select>
                    <option>Midnight</option>
                    <option>Cloud</option>
                </select><button class="btn" style="width:100%;margin-top:12px"
                    onclick="c.textContent=+c.textContent+1">Add to Cart</button>
            </div>
        </div>
    </main>
    <script>
        
    </script>
</body>

</html>

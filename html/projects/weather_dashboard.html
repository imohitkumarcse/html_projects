<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Weather Dashboard</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033
        }

        nav {
            padding: 16px 5%;
            background: #fff;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0
        }

        main {
            max-width: 1100px;
            margin: auto;
            padding: 30px 20px
        }

        .hero {
            padding: 55px 0
        }

        h1 {
            font-size: clamp(40px, 7vw, 76px)
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px
        }

        .card {
            background: #fff;
            padding: 20px;
            border: 1px solid #e4e7ee;
            border-radius: 18px;
            box-shadow: 0 8px 25px #0000000b
        }

        .btn {
            background: #5757f7;
            color: #fff;
            border: 0;
            border-radius: 10px;
            padding: 11px 16px;
            font-weight: bold;
            cursor: pointer
        }

        .alt {
            background: #eef0ff;
            color: #4b4bd2
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px
        }

        .row {
            display: flex;
            gap: 10px
        }

        .tag {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 99px;
            background: #eef0ff;
            color: #4b4bd2;
            font-size: 12px;
            font-weight: bold
        }

        .stat {
            font-size: 32px;
            font-weight: bold
        }

        @media(max-width:650px) {
            .row {
                flex-wrap: wrap
            }
        }
    </style>
</head>

<body>
    <nav><b>☁️ WEATHEROS</b><button class="btn" onclick="alert('Location demo')">Use Location</button></nav>
    <main>
        <section class="hero card">
            <h1 id="city">New Delhi</h1>
            <div id="temp" class="stat">29°C</div>
            <p id="desc">Partly cloudy</p><input id="q" placeholder="Search city"
                onkeydown="if(event.key=='Enter')changeCity()">
        </section>
        <div id="forecast" class="grid"></div>
    </main>
    <script>const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"]; forecast.innerHTML = days.map((d, i) => `<div class="card"><b>${d}</b><div style="font-size:45px">${["☀️", "🌤️", "☁️", "🌧️"][i % 4]}</div><b>${24 + i}°C</b></div>`).join(""); function changeCity() { city.textContent = q.value || "New Delhi"; temp.textContent = Math.floor(20 + Math.random() * 15) + "°C" }</script>
</body>

</html>
